<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Neon Drift Racer 3D – by Yuvraj</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Neon Drift Racer 3D – a high-graphics 3D highway racing game by Yuvraj. Dodge traffic in a neon city highway and reach the highest distance.">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: radial-gradient(circle at top, #020617 0, #020617 50%, #000000 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      text-align: center;
      color: #f97316;
      text-shadow: 0 0 16px rgba(249,115,22,0.9);
    }

    #subtitle {
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
      margin-bottom: 10px;
      max-width: 520px;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 2 / 3; /* 400x600 style */
    }

    #threeContainer {
      position: absolute;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      border: 2px solid #0f172a;
      box-shadow: 0 20px 40px rgba(0,0,0,0.9);
      background: radial-gradient(circle at top, #020617 0, #020617 50%, #000000 100%);
    }

    .hint-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      pointer-events: none;
      padding: 8px 10px;
    }

    .hint-box {
      background: radial-gradient(circle at top left, rgba(15,23,42,0.9), rgba(15,23,42,0.98));
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.6);
      padding: 6px 10px;
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
      box-shadow: 0 10px 24px rgba(0,0,0,0.85);
    }

    #footerName {
      margin-top: 10px;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }

    /* HUD */
    #hud {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      padding: 6px 10px;
      font-size: 12px;
      pointer-events: none;
    }
    #hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      color: #e5e7eb;
    }
    #hud-left {
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    #hud-right {
      text-align:right;
      font-size:12px;
      color:#9ca3af;
    }
    #hud-msg {
      margin-top: 4px;
      text-align: center;
      font-size: 12px;
      color: #facc15;
      min-height: 16px;
    }

    #centerMsg {
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      text-align:center;
      font-size:14px;
      color:#e5e7eb;
      text-shadow:0 0 12px rgba(0,0,0,0.9);
      pointer-events:none;
    }
  </style>
</head>
<body>
  <h1>Neon Drift Racer 3D – by Yuvraj</h1>
  <div id="subtitle">
    3D neon highway racer. Move left/right to dodge traffic and survive as long as possible.<br>
    PC: <strong>← / →</strong> or <strong>A / D</strong> · Mobile: swipe/drag left-right on the road.
  </div>

  <div class="canvas-wrapper">
    <div id="threeContainer"></div>
    <div id="hud">
      <div id="hud-top">
        <div id="hud-left">
          <div id="hud-distance">Distance: 0m</div>
          <div id="hud-best">Best: 0m</div>
        </div>
        <div id="hud-right">
          Made by Yuvraj
        </div>
      </div>
      <div id="hud-msg"></div>
    </div>
    <div class="hint-overlay">
      <div class="hint-box" id="hintText">
        Loading 3D cars & trucks…
      </div>
    </div>
    <div id="centerMsg"></div>
  </div>

  <div id="footerName">
    Game owner: <strong>Yuvraj</strong>
  </div>

  <!-- Three.js + GLTFLoader -->
  <script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.150.1/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    // ===== BASIC DOM / HUD =====
    const container   = document.getElementById("threeContainer");
    const hintEl      = document.getElementById("hintText");
    const hudDistance = document.getElementById("hud-distance");
    const hudBest     = document.getElementById("hud-best");
    const hudMsg      = document.getElementById("hud-msg");
    const centerMsgEl = document.getElementById("centerMsg");

    const OWNER_NAME = "Yuvraj";

    // ===== SOUNDS =====
    const engineSound = new Audio("drift-engine.mp3");
    const crashSound  = new Audio("explosion.mp3");

    engineSound.loop   = true;
    engineSound.volume = 0.5;
    crashSound.volume  = 0.9;

    let audioUnlocked = false;

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      [crashSound].forEach(sound => {
        if (!sound) return;
        try {
          sound.currentTime = 0;
          sound.play().then(() => {
            sound.pause();
            sound.currentTime = 0;
          }).catch(() => {});
        } catch (e) {}
      });
    }

    function playSound(sound) {
      if (!sound) return;
      try {
        sound.currentTime = 0;
        sound.play().catch(()=>{});
      } catch (e) {}
    }

    function startEngine() {
      try {
        engineSound.currentTime = 0;
        engineSound.play().catch(()=>{});
      } catch (e) {}
    }

    function stopEngine() {
      try {
        engineSound.pause();
      } catch (e) {}
    }

    // ===== SCORE / BEST (localStorage) =====
    let distance = 0;
    let bestDist = 0;

    const LS_DRIFT3D_BEST = "drift3d_best_distance_v1";

    function loadProgress() {
      try {
        const saved = localStorage.getItem(LS_DRIFT3D_BEST);
        if (saved !== null) bestDist = parseInt(saved, 10) || 0;
      } catch(e){}
      hudBest.textContent = "Best: " + Math.floor(bestDist) + "m";
    }

    function saveProgress() {
      try {
        localStorage.setItem(LS_DRIFT3D_BEST, String(bestDist));
      } catch(e){}
    }

    function updateDistanceHUD() {
      hudDistance.textContent = "Distance: " + Math.floor(distance) + "m";
      hudBest.textContent     = "Best: " + Math.floor(bestDist) + "m";
    }

    // ===== THREE.JS SETUP =====
    let scene, camera, renderer, clock;
    const obstacles = [];
    const laneLineSegments = [];
    const sideObjects = [];

    const ROAD_WIDTH  = 8;
    const ROAD_LENGTH = 200;
    const LANE_COUNT  = 3;
    const LANE_WIDTH  = ROAD_WIDTH / LANE_COUNT;
    const LANE_X = [
      -ROAD_WIDTH/2 + LANE_WIDTH*0.5,
      0,
      ROAD_WIDTH/2 - LANE_WIDTH*0.5
    ];

    const CAR_TARGET_WIDTH  = 1.6;
    const CAR_TARGET_LENGTH = 3.8;

    const car = {
      mesh: null,
      width: CAR_TARGET_WIDTH,
      length: CAR_TARGET_LENGTH
    };

    let explosion = null;

    // ===== GAME STATE =====
    let gameState = "loading"; // "loading", "ready", "running", "over"
    let speed     = 40;
    let baseSpeed = 40;
    let maxSpeed  = 120;
    let spawnTimer = 0;
    let baseSpawnInterval = 1.0;

    const DIFF_CONFIG = {
      easy:   { label:"Easy",   speedBase:40, speedMax:110, spawnBase:1.2, laneFactor:0.22 },
      medium: { label:"Medium", speedBase:50, speedMax:130, spawnBase:0.9, laneFactor:0.30 },
      hard:   { label:"Hard",   speedBase:60, speedMax:150, spawnBase:0.7, laneFactor:0.38 }
    };
    let difficulty = "easy";

    let pointerDown = false;
    let pointerStartX = 0;
    let carStartX     = 0;

    // GLTF models
    let playerCarBase     = null;
    let trafficCarBase    = null;
    let trafficTruckBase  = null;
    let trafficCarSize    = null;
    let trafficTruckSize  = null;

    let modelsLoaded = false;

    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020617);
      scene.fog = new THREE.Fog(0x020617, 20, 130);

      const aspect = container.clientWidth / container.clientHeight;
      camera = new THREE.PerspectiveCamera(60, aspect, 0.1, 200);
      camera.position.set(0, 6.3, 12);
      camera.lookAt(0, 2, -10);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      clock = new THREE.Clock();

      const ambient = new THREE.AmbientLight(0xffffff, 0.45);
      scene.add(ambient);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      const hemi = new THREE.HemisphereLight(0x2563eb, 0x020617, 0.35);
      scene.add(hemi);

      const roadGeom = new THREE.BoxGeometry(ROAD_WIDTH, 0.2, ROAD_LENGTH);
      const roadMat  = new THREE.MeshStandardMaterial({
        color: 0x111827,
        metalness: 0.4,
        roughness: 0.8
      });
      const road = new THREE.Mesh(roadGeom, roadMat);
      road.position.set(0, 0, -ROAD_LENGTH/2 + 20);
      scene.add(road);

      const lineGeom = new THREE.BoxGeometry(0.12, 0.04, 2.2);
      const lineMat  = new THREE.MeshBasicMaterial({ color: 0x9ca3af });
      const SEG_COUNT = 18;
      const SEG_SPACING = 6;

      for (let laneIndex = 1; laneIndex < LANE_COUNT; laneIndex++) {
        const x = -ROAD_WIDTH/2 + LANE_WIDTH * laneIndex;
        for (let i = 0; i < SEG_COUNT; i++) {
          const m = new THREE.Mesh(lineGeom, lineMat);
          m.position.set(x, 0.12, -i * SEG_SPACING);
          laneLineSegments.push(m);
          scene.add(m);
        }
      }

      initSideObjects();
      onWindowResize();
      window.addEventListener("resize", onWindowResize);

      loadModelsOrFallback();
    }

    function initSideObjects() {
      const poleGeom = new THREE.CylinderGeometry(0.06, 0.08, 2.2, 8);
      const poleMat  = new THREE.MeshStandardMaterial({ color: 0x1f2937, metalness:0.4, roughness:0.6});
      const lampGeom = new THREE.SphereGeometry(0.16, 12, 12);
      const lampMat  = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

      const sideCount = 10;
      const zSpacing  = 18;

      for (let i=0; i<sideCount; i++) {
        const baseZ = -i * zSpacing - 10;

        const leftGroup = new THREE.Group();
        const lp = new THREE.Mesh(poleGeom, poleMat);
        lp.position.set(-ROAD_WIDTH/2 - 1.5, 1.1, baseZ);
        const ll = new THREE.Mesh(lampGeom, lampMat);
        ll.position.set(-ROAD_WIDTH/2 - 1.5, 2.2, baseZ);
        leftGroup.add(lp, ll);
        scene.add(leftGroup);
        sideObjects.push(leftGroup);

        const rightGroup = new THREE.Group();
        const rp = lp.clone();
        rp.position.x = ROAD_WIDTH/2 + 1.5;
        const rl = ll.clone();
        rl.position.x = ROAD_WIDTH/2 + 1.5;
        rightGroup.add(rp, rl);
        scene.add(rightGroup);
        sideObjects.push(rightGroup);

        const bLeft  = createBuilding(-ROAD_WIDTH/2 - 6, baseZ - 4);
        const bRight = createBuilding( ROAD_WIDTH/2 + 6, baseZ - 10);
        scene.add(bLeft, bRight);
        sideObjects.push(bLeft, bRight);
      }
    }

    // Buildings with window lights
    function createBuilding(x, z) {
      const width  = 3 + Math.random()*3;
      const height = 6 + Math.random()*10;
      const depth  = 5 + Math.random()*4;

      const group = new THREE.Group();

      const baseGeom = new THREE.BoxGeometry(width, height, depth);
      const baseMat  = new THREE.MeshStandardMaterial({
        color: 0x020617,
        metalness: 0.3,
        roughness: 0.8
      });
      const base = new THREE.Mesh(baseGeom, baseMat);
      base.position.set(0, height/2, 0);
      group.add(base);

      const winGeom = new THREE.PlaneGeometry(0.3, 0.4);
      const litColor  = 0xfacc15;
      const darkColor = 0x111827;

      const rows = Math.floor(height / 1.2);
      const cols = Math.floor(width  / 0.8);

      for (let i=0; i<rows; i++) {
        for (let j=0; j<cols; j++) {
          if (Math.random() < 0.4) continue;

          const mat = new THREE.MeshBasicMaterial({
            color: (Math.random()<0.7) ? litColor : darkColor,
            side: THREE.FrontSide
          });
          const w = new THREE.Mesh(winGeom, mat);
          const wx = -width/2  + 0.5 + j * 0.7;
          const wy = 0.8 + i * 0.9;
          const wz = depth/2 + 0.01;
          w.position.set(wx, wy, wz);
          group.add(w);
        }
      }

      group.position.set(x, 0, z);
      return group;
    }

    function onWindowResize() {
      if (!renderer || !camera) return;
      const width  = container.clientWidth || 400;
      const height = container.clientHeight || 600;
      renderer.setSize(width, height);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    // ===== MODEL LOADING (with fallback) =====
    function normalizeModel(root, targetWidth, targetLength) {
      const box   = new THREE.Box3().setFromObject(root);
      const center= new THREE.Vector3();
      const size  = new THREE.Vector3();
      box.getCenter(center);
      box.getSize(size);

      root.position.sub(center);

      const scaleX = targetWidth  / size.x;
      const scaleZ = targetLength / size.z;
      const scale  = Math.min(scaleX, scaleZ);
      root.scale.setScalar(scale);

      const newBox = new THREE.Box3().setFromObject(root);
      const newSize= new THREE.Vector3();
      newBox.getSize(newSize);

      return {
        width:  newSize.x,
        height: newSize.y,
        length: newSize.z
      };
    }

    function makeFallbackModels() {
      // Player car fallback
      const carGroup = new THREE.Group();
      const bodyGeom = new THREE.BoxGeometry(CAR_TARGET_WIDTH, 0.8, CAR_TARGET_LENGTH);
      const bodyMat  = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, metalness:0.4, roughness:0.4 });
      const bodyMesh = new THREE.Mesh(bodyGeom, bodyMat);
      bodyMesh.position.y = 0.4;
      carGroup.add(bodyMesh);
      car.width  = CAR_TARGET_WIDTH;
      car.length = CAR_TARGET_LENGTH;
      playerCarBase = carGroup;

      // Traffic car fallback
      const tcGroup = new THREE.Group();
      const tcGeom  = new THREE.BoxGeometry(1.4, 0.9, 3.0);
      const tcMat   = new THREE.MeshStandardMaterial({ color: 0xf97316, metalness:0.3, roughness:0.4 });
      const tcMesh  = new THREE.Mesh(tcGeom, tcMat);
      tcMesh.position.y = 0.45;
      tcGroup.add(tcMesh);
      trafficCarBase = tcGroup;
      trafficCarSize = { width:1.4, length:3.0 };

      // Truck fallback
      const ttGroup = new THREE.Group();
      const ttGeom  = new THREE.BoxGeometry(1.8, 1.5, 6.0);
      const ttMat   = new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness:0.3, roughness:0.4 });
      const ttMesh  = new THREE.Mesh(ttGeom, ttMat);
      ttMesh.position.y = 0.75;
      ttGroup.add(ttMesh);
      trafficTruckBase = ttGroup;
      trafficTruckSize = { width:1.8, length:6.0 };

      modelsLoaded = true;
      createPlayerCar();
      if (hintEl) {
        hintEl.textContent = "Tap / Press Space to start. Swipe / drag to steer.";
      }
      centerMsgEl.textContent = "Press Space / Tap to start";
      hudMsg.textContent = "(Using simple 3D cars – model loading failed)";
      gameState = "ready";
    }

    let playerCarBase = null;
    let trafficCarBase= null;
    let trafficTruckBase=null;
    let trafficCarSize = null;
    let trafficTruckSize = null;

    function loadModelsOrFallback() {
      // Check if GLTFLoader is available
      if (!THREE || typeof THREE.GLTFLoader !== "function") {
        console.warn("GLTFLoader not available, using fallback box cars.");
        makeFallbackModels();
        return;
      }

      const loader = new THREE.GLTFLoader();
      let toLoad = 3;

      function doneOne() {
        toLoad--;
        if (toLoad <= 0) {
          modelsLoaded = true;
          createPlayerCar();
          if (hintEl) {
            hintEl.textContent = "Tap / Press Space to start. Swipe / drag to steer.";
          }
          centerMsgEl.textContent = "Press Space / Tap to start";
          hudMsg.textContent = "";
          gameState = "ready";
        }
      }

      // Player car (Lamborghini)
      loader.load(
        "player-car.glb",
        (gltf) => {
          const root = gltf.scene;
          const size = normalizeModel(root, CAR_TARGET_WIDTH, CAR_TARGET_LENGTH);
          playerCarBase = root;
          car.width  = size.width;
          car.length = size.length;
          doneOne();
        },
        undefined,
        (err) => {
          console.error("player-car.glb failed", err);
          playerCarBase = null;
          doneOne();
        }
      );

      // Traffic car
      loader.load(
        "traffic-car.glb",
        (gltf) => {
          const root = gltf.scene;
          trafficCarSize = normalizeModel(root, 1.4, 3.0);
          trafficCarBase = root;
          doneOne();
        },
        undefined,
        (err) => {
          console.error("traffic-car.glb failed", err);
          trafficCarBase = null;
          doneOne();
        }
      );

      // Traffic truck
      loader.load(
        "traffic-truck.glb",
        (gltf) => {
          const root = gltf.scene;
          trafficTruckSize = normalizeModel(root, 1.8, 6.0);
          trafficTruckBase = root;
          doneOne();
        },
        undefined,
        (err) => {
          console.error("traffic-truck.glb failed", err);
          trafficTruckBase = null;
          doneOne();
        }
      );

      // Safety timeout – agar 8 seconds me load nahi hua toh fallback pe aa jao
      setTimeout(() => {
        if (!modelsLoaded) {
          console.warn("Model load timeout, using fallback box cars.");
          makeFallbackModels();
        }
      }, 8000);
    }

    function createPlayerCar() {
      if (!playerCarBase) {
        // fallback already handle karega
        return;
      }
      if (car.mesh) scene.remove(car.mesh);
      const clone = playerCarBase.clone(true);
      clone.position.set(0, 0, 4);
      scene.add(clone);
      car.mesh = clone;
    }

    // ===== OBSTACLES =====
    function createObstacle() {
      if (!trafficCarBase || !trafficTruckBase || !trafficCarSize || !trafficTruckSize) {
        // fallback if needed (box cars)
        if (!trafficCarBase || !trafficCarSize) return;
      }

      const laneIndex = Math.floor(Math.random() * LANE_COUNT);
      const laneX     = LANE_X[laneIndex];

      const isTruck = Math.random() < 0.35;
      let base, size;

      if (isTruck && trafficTruckBase && trafficTruckSize) {
        base = trafficTruckBase;
        size = trafficTruckSize;
      } else {
        base = trafficCarBase;
        size = trafficCarSize;
      }

      const clone = base.clone(true);
      clone.position.set(laneX, 0, -80 - Math.random()*40);
      scene.add(clone);

      obstacles.push({
        mesh: clone,
        isTruck,
        width: size.width,
        length: size.length
      });
    }

    function updateObstacles(dt) {
      for (let i = obstacles.length-1; i >= 0; i--) {
        const o = obstacles[i];
        o.mesh.position.z += speed * dt;
        if (o.mesh.position.z > 25) {
          scene.remove(o.mesh);
          obstacles.splice(i,1);
        }
      }
    }

    function checkCollisions() {
      if (!car.mesh) return;

      const cx = car.mesh.position.x;
      const cz = car.mesh.position.z;
      const cHalfW = car.width  * 0.5;
      const cHalfL = car.length * 0.5;

      for (const o of obstacles) {
        const ox = o.mesh.position.x;
        const oz = o.mesh.position.z;
        const oHalfW = o.width  * 0.5;
        const oHalfL = o.length * 0.5;

        const dx = Math.abs(cx - ox);
        const dz = Math.abs(cz - oz);

        if (dx < (cHalfW + oHalfW) && dz < (cHalfL + oHalfL)) {
          handleCrash();
          return;
        }
      }
    }

    // ===== SIDE OBJECTS MOVE =====
    function updateSideObjects(dt) {
      const loopZ = 18 * 10;
      for (const obj of sideObjects) {
        obj.position.z += speed * 0.4 * dt;
        if (obj.position.z > 24) {
          obj.position.z -= loopZ;
        }
      }
    }

    // ===== EXPLOSION =====
    function triggerExplosion() {
      if (explosion && explosion.mesh) {
        scene.remove(explosion.mesh);
      }
      const geom = new THREE.SphereGeometry(0.5, 16, 16);
      const mat  = new THREE.MeshBasicMaterial({
        color: 0xf97316,
        transparent: true,
        opacity: 1
      });
      const mesh = new THREE.Mesh(geom, mat);
      if (car.mesh) mesh.position.copy(car.mesh.position);
      scene.add(mesh);
      explosion = {
        mesh,
        radius: 0.5,
        alpha: 1
      };
      playSound(crashSound);
    }

    function updateExplosion(dt) {
      if (!explosion) return;
      explosion.radius += 10 * dt;
      explosion.alpha  -= 2.0 * dt;
      if (explosion.alpha <= 0) {
        scene.remove(explosion.mesh);
        explosion = null;
        return;
      }
      explosion.mesh.scale.setScalar(explosion.radius);
      explosion.mesh.material.opacity = Math.max(0, explosion.alpha);
    }

    // ===== GAME CONTROL =====
    function resetGameState() {
      const cfg = DIFF_CONFIG[difficulty];
      distance  = 0;
      baseSpeed = cfg.speedBase;
      speed     = baseSpeed;
      baseSpawnInterval = cfg.spawnBase;
      spawnTimer = 0;

      for (const o of obstacles) {
        scene.remove(o.mesh);
      }
      obstacles.length = 0;

      if (car.mesh) {
        car.mesh.position.set(0, 0, 4);
      }

      if (explosion) {
        scene.remove(explosion.mesh);
        explosion = null;
      }

      gameState = modelsLoaded ? "ready" : "loading";
      centerMsgEl.textContent = modelsLoaded ? "Press Space / Tap to start" : "Loading 3D cars & trucks…";
      if (hintEl && modelsLoaded) {
        hintEl.textContent = "Swipe / drag to steer · Avoid all traffic · Try to beat your best distance.";
      }
      hudMsg.textContent = "";
      updateDistanceHUD();
    }

    function startGame() {
      if (!modelsLoaded) return;
      resetGameState();
      gameState = "running";
      startEngine();
      centerMsgEl.textContent = "";
      if (hintEl) {
        hintEl.textContent = "";
      }
      hudMsg.textContent = "";
    }

    function handleCrash() {
      if (gameState === "over") return;
      gameState = "over";
      stopEngine();
      triggerExplosion();

      if (distance > bestDist) {
        bestDist = distance;
        saveProgress();
      }
      updateDistanceHUD();

      centerMsgEl.textContent = "Crashed! Tap / Space to retry";
      hudMsg.textContent = "Endless run ended. Try again to beat your best distance.";
    }

    // ===== MAIN UPDATE =====
    function updateGame(dt) {
      if (gameState === "loading") return;

      if (gameState !== "running") {
        updateExplosion(dt);
        return;
      }

      const cfg = DIFF_CONFIG[difficulty];

      distance += speed * dt * 0.7;
      if (distance > bestDist) {
        bestDist = distance;
      }
      updateDistanceHUD();

      const targetSpeed = cfg.speedBase + distance * 0.01;
      speed = Math.min(targetSpeed, cfg.speedMax);

      for (const seg of laneLineSegments) {
        seg.position.z += speed * cfg.laneFactor * dt;
        if (seg.position.z > 10) {
          seg.position.z -= 6 * 18;
        }
      }

      updateSideObjects(dt);

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        createObstacle();
        const minI = baseSpawnInterval * 0.6;
        const maxI = baseSpawnInterval * 1.2;
        spawnTimer = minI + Math.random() * (maxI - minI);
      }

      updateObstacles(dt);
      checkCollisions();
      updateExplosion(dt);

      const speedFactor = (speed - cfg.speedBase) / (cfg.speedMax - cfg.speedBase);
      const shakeAmp = Math.max(0, Math.min(speedFactor, 1)) * 0.08;
      const carX = car.mesh ? car.mesh.position.x : 0;

      camera.position.x = carX * 0.25 + Math.sin(performance.now()*0.003)*shakeAmp;
      camera.position.y = 6.3 + Math.sin(performance.now()*0.002)*shakeAmp*0.7;
      camera.lookAt(0, 2, -10);
    }

    function render() {
      renderer.render(scene, camera);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      updateGame(dt);
      render();
    }

    // ===== INPUT =====
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        unlockAudio();
        if (gameState === "ready" || gameState === "over") {
          startGame();
        }
      }
      if (e.code === "ArrowLeft" || e.key === "a" || e.key === "A") {
        unlockAudio();
        if (gameState === "running" && car.mesh) {
          const minX = -ROAD_WIDTH/2 + car.width*0.7;
          const maxX =  ROAD_WIDTH/2 - car.width*0.7;
          car.mesh.position.x = Math.max(minX, car.mesh.position.x - 0.6);
        }
      }
      if (e.code === "ArrowRight" || e.key === "d" || e.key === "D") {
        unlockAudio();
        if (gameState === "running" && car.mesh) {
          const minX = -ROAD_WIDTH/2 + car.width*0.7;
          const maxX =  ROAD_WIDTH/2 - car.width*0.7;
          car.mesh.position.x = Math.min(maxX, car.mesh.position.x + 0.6);
        }
      }
    });

    function startPointerDrag(clientX) {
      unlockAudio();
      if (gameState === "ready" || gameState === "over") {
        startGame();
      }
      if (gameState !== "running" || !car.mesh) return;
      const rect = container.getBoundingClientRect();
      pointerDown   = true;
      pointerStartX = clientX - rect.left;
      carStartX     = car.mesh.position.x;
    }

    function updatePointerDrag(clientX) {
      if (!pointerDown || gameState !== "running" || !car.mesh) return;
      const rect = container.getBoundingClientRect();
      const xCanvas = clientX - rect.left;
      const dx = xCanvas - pointerStartX;
      let newX = carStartX + dx * (ROAD_WIDTH / rect.width);
      const minX = -ROAD_WIDTH/2 + car.width*0.7;
      const maxX =  ROAD_WIDTH/2 - car.width*0.7;
      if (newX < minX) newX = minX;
      if (newX > maxX) newX = maxX;
      car.mesh.position.x = newX;
    }

    function endPointerDrag() {
      pointerDown = false;
    }

    container.addEventListener("mousedown", (e) => {
      startPointerDrag(e.clientX);
    });

    document.addEventListener("mousemove", (e) => {
      updatePointerDrag(e.clientX);
    });

    document.addEventListener("mouseup", () => {
      endPointerDrag();
    });

    container.addEventListener("touchstart", (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      startPointerDrag(touch.clientX);
    }, { passive: false });

    document.addEventListener("touchmove", (e) => {
      if (!pointerDown) return;
      e.preventDefault();
      const touch = e.touches[0];
      updatePointerDrag(touch.clientX);
    }, { passive: false });

    document.addEventListener("touchend", () => {
      endPointerDrag();
    });

    // ===== INIT =====
    loadProgress();
    scene = null;
    initThree();
    clock = new THREE.Clock();
    clock.start();
    animate();
  </script>
</body>
</html>
