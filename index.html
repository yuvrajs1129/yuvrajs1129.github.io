<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Games made by Yuvraj</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Play free browser games made by Yuvraj. Eagle Flight and more HTML5 games, no download needed.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: radial-gradient(circle at top, #0b1120 0, #020617 55%, #000 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: 26px;
      text-align: center;
      color: #f97316;
      text-shadow: 0 0 12px rgba(249, 115, 22, 0.7);
    }

    #subtitle {
      font-size: 14px;
      color: #9ca3af;
      text-align: center;
      margin-bottom: 18px;
    }

    #gamesGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 600px;
    }

    .game-card {
      background: linear-gradient(145deg, #020617, #020617);
      border-radius: 14px;
      border: 1px solid #1f2937;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px rgba(0,0,0,0.7);
      border-color: #38bdf8;
    }

    .game-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 20%, #fefce8, #facc15 40%, #b45309 100%);
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.7);
      font-size: 32px;
    }

    .game-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #e5e7eb;
    }

    .game-meta {
      font-size: 12px;
      color: #9ca3af;
    }

    #footerName {
      margin-top: auto;
      padding-top: 16px;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Games made by Yuvraj</h1>
  <div id="subtitle">
    Niche diye gaye icons par click karke apne favourite games khelo.
  </div>

  <div id="gamesGrid">
    <!-- Eagle Flight game card -->
    <a class="game-card" href="eagle.html">
      <div class="game-icon">
        🦅
      </div>
      <div class="game-title">Eagle Flight</div>
      <div class="game-meta">
        Flappy-style arcade game · Tap to fly
      </div>
    </a>

    <!-- Future games yahan add kar sakte ho:
    <a class="game-card" href="game2.html">
      <div class="game-icon">🍬</div>
      <div class="game-title">Candy Match</div>
      <div class="game-meta">Match-3 puzzle game</div>
    </a>
    -->
  </div>

  <div id="footerName">
    Website & games created by <strong>Yuvraj</strong>
  </div>
</body>
</html>
