<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yuvraj Games – Premium Arcade</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

:root{
  --bg:#020617;
  --glass:rgba(15,23,42,0.85);
  --border:#1f2937;
  --orange:#f97316;
  --blue:#38bdf8;
  --purple:#a855f7;
}

body{
  margin:0;
  padding:20px;
  font-family:system-ui;
  background:
    radial-gradient(circle at top left, #111827 0%, #020617 60%),
    radial-gradient(circle at bottom right, rgba(168,85,247,0.2), #000 80%);
  color:#e5e7eb;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  overflow-x:hidden;
}

/* HERO */
.hero{
  text-align:center;
  margin-bottom:30px;
  animation:fadeIn 1s ease;
}

.hero h1{
  font-size:34px;
  margin-bottom:10px;
  background:linear-gradient(90deg,var(--orange),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  color:#9ca3af;
  font-size:14px;
  max-width:600px;
  margin:auto;
}

/* PLAY BUTTON */
.play-btn{
  margin-top:20px;
  padding:12px 24px;
  border-radius:999px;
  border:none;
  font-size:15px;
  cursor:pointer;
  background:linear-gradient(135deg,var(--orange),#ffb347);
  color:#020617;
  font-weight:600;
  box-shadow:0 10px 30px rgba(249,115,22,0.4);
  transition:0.2s;
}
.play-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 40px rgba(249,115,22,0.6);
}

/* PLAYER CARD */
.player-card{
  width:100%;
  max-width:600px;
  background:var(--glass);
  backdrop-filter:blur(18px);
  border:1px solid var(--border);
  border-radius:20px;
  padding:16px 20px;
  margin-bottom:30px;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  box-shadow:0 20px 40px rgba(0,0,0,0.7);
}

/* GAMES */
.games{
  width:100%;
  max-width:900px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
}

.game-card{
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  text-align:center;
  text-decoration:none;
  color:inherit;
  transition:0.25s;
  position:relative;
  overflow:hidden;
}

.game-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at top left,rgba(56,189,248,0.2),transparent 60%);
  opacity:0;
  transition:0.3s;
}

.game-card:hover{
  transform:translateY(-6px);
  border-color:var(--orange);
}
.game-card:hover::before{
  opacity:1;
}

.game-icon{
  font-size:40px;
  margin-bottom:8px;
}

footer{
  margin-top:auto;
  padding-top:40px;
  font-size:13px;
  color:#64748b;
}

/* ANIMATION */
@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="hero">
  <h1>Yuvraj Premium Arcade</h1>
  <p>High‑quality neon browser games. Level up, unlock rewards, and experience next‑level arcade gameplay.</p>
  <button class="play-btn" onclick="scrollToGames()">🎮 Play Games Now</button>
</div>

<div class="player-card">
  <div>
    👤 <strong id="playerName"></strong><br>
    ⭐ Level <span id="playerLevel"></span>
  </div>
  <div>
    🪙 Coins: <span id="playerCoins"></span><br>
    ⚡ XP: <span id="playerXP"></span>
  </div>
</div>

<div class="games" id="gamesSection">

  <a class="game-card" href="eagle.html">
    <div class="game-icon">🦅</div>
    <strong>Eagle Flight</strong>
  </a>

  <a class="game-card" href="space.html">
    <div class="game-icon">🚀</div>
    <strong>Neon Space Runner</strong>
  </a>

  <a class="game-card" href="drift.html">
    <div class="game-icon">🚗</div>
    <strong>Neon Drift Racer 3D</strong>
  </a>

  <a class="game-card" href="xo.html">
    <div class="game-icon">❌</div>
    <strong>X/O Bot Duel</strong>
  </a>

</div>

<footer>
  Designed & Developed by <strong>Yuvraj</strong>
</footer>

<script>
const LS_PLAYER_DATA="yuvraj_player_data_v1";

let playerData={
  name:"",
  coins:0,
  xp:0,
  level:1
};

function loadPlayerData(){
  try{
    const saved=localStorage.getItem(LS_PLAYER_DATA);
    if(saved){
      playerData=JSON.parse(saved);
    }
  }catch(e){}
}

function savePlayerData(){
  localStorage.setItem(LS_PLAYER_DATA,JSON.stringify(playerData));
}

function calculateLevel(){
  playerData.level=Math.floor(playerData.xp/100)+1;
}

function updateUI(){
  document.getElementById("playerName").textContent=playerData.name;
  document.getElementById("playerCoins").textContent=playerData.coins;
  document.getElementById("playerXP").textContent=playerData.xp;
  document.getElementById("playerLevel").textContent=playerData.level;
}

function scrollToGames(){
  document.getElementById("gamesSection").scrollIntoView({behavior:"smooth"});
}

loadPlayerData();

if(!playerData.name){
  const name=prompt("Enter your player name:");
  playerData.name=name||"Player";
  savePlayerData();
}

calculateLevel();
updateUI();
</script>

</body>
</html>
