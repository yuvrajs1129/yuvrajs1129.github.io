<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yuvraj Games – Premium Arcade</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at top, #020617 0, #020617 60%, #000 100%);
  color: #e5e7eb;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}

h1 {
  margin: 0 0 8px;
  font-size: 26px;
  color: #f97316;
  text-shadow: 0 0 12px rgba(249,115,22,0.8);
}

.subtitle {
  font-size: 14px;
  color: #9ca3af;
  margin-bottom: 16px;
  text-align: center;
}

.player-card {
  width: 100%;
  max-width: 500px;
  padding: 14px;
  border-radius: 16px;
  background: rgba(15,23,42,0.95);
  border: 1px solid #1f2937;
  box-shadow: 0 10px 25px rgba(0,0,0,0.7);
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  font-size: 14px;
}

.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
  width: 100%;
  max-width: 800px;
}

.game-card {
  background: rgba(15,23,42,0.95);
  border-radius: 14px;
  padding: 16px;
  text-align: center;
  text-decoration: none;
  color: inherit;
  border: 1px solid #1f2937;
  transition: transform 0.15s ease;
}

.game-card:hover {
  transform: translateY(-4px);
  border-color: #f97316;
}

.game-icon {
  font-size: 36px;
  margin-bottom: 8px;
}

footer {
  margin-top: auto;
  padding-top: 20px;
  font-size: 13px;
  color: #64748b;
}
</style>
</head>

<body>

<h1>🎮 Yuvraj Games</h1>
<div class="subtitle">
  Play premium browser games. Earn XP, level up and unlock achievements.
</div>

<!-- ✅ PLAYER CARD -->
<div class="player-card">
  <div>
    👤 <strong id="playerName"></strong><br>
    ⭐ Level <span id="playerLevel"></span>
  </div>

  <div>
    🪙 Coins: <span id="playerCoins"></span><br>
    ⚡ XP: <span id="playerXP"></span>
  </div>
</div>

<!-- ✅ GAMES -->
<div class="games-grid">

  <a class="game-card" href="eagle.html">
    <div class="game-icon">🦅</div>
    Eagle Flight
  </a>

  <a class="game-card" href="space.html">
    <div class="game-icon">🚀</div>
    Space Runner
  </a>

  <a class="game-card" href="drift.html">
    <div class="game-icon">🚗</div>
    Neon Drift Racer 3D
  </a>

  <a class="game-card" href="xo.html">
    <div class="game-icon">❌</div>
    X/O Bot Duel
  </a>

</div>

<footer>
  Website & Games created by <strong>Yuvraj</strong>
</footer>

<script>
/* ===============================
   ✅ PLAYER SYSTEM
================================= */

const LS_PLAYER_DATA = "yuvraj_player_data_v1";

let playerData = {
  name: "",
  coins: 0,
  xp: 0,
  level: 1
};

function loadPlayerData() {
  try {
    const saved = localStorage.getItem(LS_PLAYER_DATA);
    if (saved) {
      playerData = JSON.parse(saved);
    }
  } catch (e) {}
}

function savePlayerData() {
  try {
    localStorage.setItem(LS_PLAYER_DATA, JSON.stringify(playerData));
  } catch (e) {}
}

function calculateLevel() {
  playerData.level = Math.floor(playerData.xp / 100) + 1;
}

function updatePlayerUI() {
  document.getElementById("playerName").textContent = playerData.name;
  document.getElementById("playerCoins").textContent = playerData.coins;
  document.getElementById("playerXP").textContent = playerData.xp;
  document.getElementById("playerLevel").textContent = playerData.level;
}

/* ===============================
   ✅ INIT
================================= */

loadPlayerData();

if (!playerData.name) {
  const name = prompt("Enter your player name:");
  if (name && name.trim() !== "") {
    playerData.name = name.trim();
  } else {
    playerData.name = "Player";
  }
  savePlayerData();
}

calculateLevel();
updatePlayerUI();
</script>

</body>
</html>
